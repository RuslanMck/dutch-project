# Standalone mode: adds Caddy (HTTPS for $DOMAIN) next to the app when there is no shared proxy.
#   docker network create web    # once
#   DOMAIN=your.domain docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d --build
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN to your domain}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]

volumes:
  caddy_data:
  caddy_config:
