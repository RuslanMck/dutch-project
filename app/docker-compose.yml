# Runs behind a shared Caddy reverse proxy on the external Docker network "web"
# (see the MyVps proxy setup). Caddy reaches this container as dutch-app:3000.
name: dutch

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/dutch.db
      BACKUP_DIR: /app/data/backups
    volumes:
      - ${DATA_DIR:-./data}:/app/data
    networks:
      web:
        aliases: [dutch-app]

networks:
  web:
    external: true
